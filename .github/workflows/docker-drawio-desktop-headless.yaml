name: Build And Release

on:
  pull_request:
  push:
    branches:
      - v1.x

env:
  DRAWIO_VERSION: "25.0.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    concurrency:
      group: build-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: true
    permissions:
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'arm64,amd64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.DRAWIO_VERSION }}-{{sha}}
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and test docker image
        run: |
          make build
          make test-ci-setup
          make test-ci
        env:
          DOCKER_IMAGE: ${{ steps.meta.outputs.tags }}

      - name: Store test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            tests/output/*.log
            tests/data
            !tests/data/*.drawio
            !tests/data/*/*.drawio

  release:
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/v1.x'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Release metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ env.DRAWIO_VERSION }}
            type=raw,value=${{ env.DRAWIO_VERSION }}-{{sha}}
            type=raw,value=latest

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Tag and Push Release Images
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          BUILD_TAGS: ${{ needs.build.outputs.tags }}
        run: |
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' '); do
            echo "Pushing: $tag"
            docker pull $(echo "$BUILD_TAGS" | tr '\n' ' ' | cut -d' ' -f1)
            docker tag $(echo "$BUILD_TAGS" | tr '\n' ' ' | cut -d' ' -f1) $tag
            docker push $tag
          done
          # Create GitHub Release
          gh release create v${DRAWIO_VERSION} \
            --title "Release ${DRAWIO_VERSION}" \
            --generate-notes
