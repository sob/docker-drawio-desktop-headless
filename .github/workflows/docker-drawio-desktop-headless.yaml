name: Build And Release

on:
  pull_request:
  push:
    branches:
      - v1.x

env:
  DRAWIO_VERSION: "25.0.2"

jobs:
  test:
    runs-on: ubuntu-24.04
    concurrency:
      group: test-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: true
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build and test docker image
        run: |
          make build
          make test-ci-setup
          make test-ci
        env:
          DOCKER_IMAGE: ghcr.io/${{ github.repository }}:test

      - name: Store test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            tests/output/*.log
            tests/data
            !tests/data/*.drawio
            !tests/data/*/*.drawio

  build:
    needs: test
    runs-on: ubuntu-24.04
    concurrency:
      group: build-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: true
    permissions:
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'linux/amd64,linux/arm64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.DRAWIO_VERSION }}-{{sha}}
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push multi-platform
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [test, build]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/v1.x'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/git
            @semantic-release/changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Generate Release metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern=v{{version}},value=v${{ env.DRAWIO_VERSION }}
            type=semver,pattern=v{{major}}.{{minor}},value=v${{ env.DRAWIO_VERSION }}
            type=semver,pattern=v{{major}},value=v${{ env.DRAWIO_VERSION }}
            type=raw,value=latest

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Tag and Push Release Images
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          BUILD_TAGS: ${{ needs.build.outputs.tags }}
        run: |
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' '); do
            echo "Pushing: $tag"
            docker pull $(echo "$BUILD_TAGS" | tr '\n' ' ' | cut -d' ' -f1)
            docker tag $(echo "$BUILD_TAGS" | tr '\n' ' ' | cut -d' ' -f1) $tag
            docker push $tag
          done
