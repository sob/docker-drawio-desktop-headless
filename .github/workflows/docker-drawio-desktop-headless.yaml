name: Build And Release

on:
  pull_request:
  push:
    branches:
      - v1.x

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr

      - name: Build docker image
        run: make build
        env:
          DOCKER_IMAGE: ${{ steps.meta.outputs.tags }}

      - name: Run tests
        run: |
          make test-ci-setup
          make test-ci
        env:
          DOCKER_IMAGE: ${{ steps.meta.outputs.tags }}

      - name: Store test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            tests/output/*.log
            tests/data
            !tests/data/*.drawio
            !tests/data/*/*.drawio

  build-multiarch:
    runs-on: ubuntu-latest
    concurrency:
      group: build-multiarch-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'arm64,arm'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr

      - name: Build multiarch image
        run: make build-multiarch
        env:
          DOCKER_IMAGE: ${{ steps.meta.outputs.tags }}

  release:
    runs-on: ubuntu-latest
    needs: [build, build-multiarch]
    if: github.event_name == 'push' && github.ref == 'refs/heads/v1.x'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Create Release and Push Image
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/*/}
          VERSION=${TAG#v}

          # Push to GHCR
          docker tag ${{ github.repository }}:${TAG} ghcr.io/${{ github.repository }}:${TAG}
          docker push ghcr.io/${{ github.repository }}:${TAG}

          # Create GitHub Release
          gh release create $TAG \
            --title "Release $VERSION" \
            --generate-notes
